<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">FRONTIERSHIP OUTPOST ONE — lean investor concept v0.2</title>
  <desc id="desc">Selected room-month pricing, room scenario, and a lean repeatable program concept. Abstract program blocks only; not a site plan, room schedule, floor plan, or engineered design.</desc>
  <defs>
    <style>
      .bg { fill: #f3f1e9; }
      .ink { fill: #172536; }
      .muted { fill: #506172; }
      .white { fill: #fffefa; }
      .navy { fill: #172536; }
      .green { fill: #2e6355; }
      .sand { fill: #e9ddc8; }
      .blue { fill: #e6eef1; }
      .line { stroke: #587466; stroke-width: 4; fill: none; }
      .dash { stroke: #a05c35; stroke-width: 2; stroke-dasharray: 9 7; fill: none; }
      .smallcaps { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 2px; }
      .title { font: 700 38px Arial, Helvetica, sans-serif; letter-spacing: 1px; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; }
      .boxTitle { font: 700 21px Arial, Helvetica, sans-serif; letter-spacing: .5px; }
      .body { font: 400 17px Arial, Helvetica, sans-serif; }
      .bodyBold { font: 700 17px Arial, Helvetica, sans-serif; }
      .metric { font: 700 30px Arial, Helvetica, sans-serif; }
      .foot { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: 1px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#587466" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="1200" />

  <text class="smallcaps green" x="70" y="52">FRONTIERSHIP · SAFETY FIRST STANDARD</text>
  <text class="title ink" x="70" y="104">OUTPOST ONE · LEAN INVESTOR CONCEPT</text>
  <text class="subtitle muted" x="70" y="137">Updated 17 October 2026 · selected working assumptions · concept only</text>
  <rect x="1280" y="47" width="250" height="48" rx="24" fill="#e9ddc8" />
  <text class="smallcaps ink" x="1405" y="77" text-anchor="middle">NOT INVESTMENT-READY</text>

  <rect class="navy" x="70" y="170" width="1460" height="130" rx="18" />
  <text class="smallcaps" x="100" y="205" fill="#c9d8d3">CURRENT OWNER BEDROOM SCENARIO</text>
  <text x="100" y="250" fill="#fffefa" style="font:700 29px Arial, Helvetica, sans-serif">62 bedrooms = 57 intended rentals + 2 owner bedrooms + 3 unallocated</text>
  <text x="100" y="278" fill="#d7e1dc" style="font:400 17px Arial, Helvetica, sans-serif">Bedrooms are not beds, bedspaces, people, approved capacity, or guaranteed revenue units. Sharing limits TBD.</text>

  <text class="smallcaps muted" x="70" y="337">LEAN REPEATABLE PROGRAM BLOCKS — NOT TO SCALE · NOT A FLOOR PLAN · EXACT ROOM MIX TBD</text>

  <rect class="white" x="70" y="365" width="340" height="270" rx="16" stroke="#c9c3b6" stroke-width="2" />
  <rect class="sand" x="70" y="365" width="340" height="54" rx="16" />
  <path d="M70 403 H410" stroke="#c9c3b6" stroke-width="2" />
  <text class="boxTitle ink" x="94" y="400">OWNER / HQ CORE</text>
  <text class="bodyBold green" x="94" y="458">2 owner bedrooms</text>
  <text class="body ink" x="94" y="490">Modern forest-cabin character</text>
  <text class="body ink" x="94" y="518">Bermed wing: option to test against</text>
  <text class="body ink" x="94" y="546">site, life-safety, and cost</text>
  <text class="body ink" x="94" y="580">Small emergency-capable medical</text>
  <text class="body ink" x="94" y="606">concept; scope and licensing TBD</text>

  <rect class="blue" x="445" y="365" width="330" height="270" rx="16" stroke="#b7c9ce" stroke-width="2" />
  <rect x="445" y="365" width="330" height="54" rx="16" fill="#d5e3e4" />
  <path d="M445 403 H775" stroke="#b7c9ce" stroke-width="2" />
  <text class="boxTitle ink" x="469" y="400">SHARED SERVICE CORE</text>
  <text class="body ink" x="469" y="458">Commons · bath · laundry</text>
  <text class="body ink" x="469" y="488">Kitchen / shared services</text>
  <text class="body ink" x="469" y="518">Concentrate wet walls / MEP</text>
  <text class="body ink" x="469" y="548">where code and operations allow</text>
  <text class="bodyBold green" x="469" y="590">BYO rented compute + demo closet</text>
  <text class="body ink" x="469" y="616">20–50 kW sustained capability target</text>

  <rect class="white" x="810" y="365" width="470" height="270" rx="16" stroke="#9bb2a5" stroke-width="2" />
  <rect x="810" y="365" width="470" height="54" rx="16" fill="#dce8df" />
  <path d="M810 403 H1280" stroke="#9bb2a5" stroke-width="2" />
  <text class="boxTitle ink" x="834" y="400">REPEATABLE RENTAL MODULES</text>
  <text class="metric green" x="834" y="463">57</text>
  <text class="bodyBold ink" x="891" y="461">intended rental bedrooms</text>
  <text class="body ink" x="834" y="500">Standard module; schedule TBD</text>
  <text class="body ink" x="834" y="530">30+ day stays · no STR direction</text>
  <text class="body ink" x="834" y="560">Beds / sharing / occupancy TBD</text>
  <text class="body ink" x="834" y="590">Repeat to optimize cost per room;</text>
  <text class="body ink" x="834" y="616">no savings or approval assumed</text>

  <rect class="white" x="1315" y="365" width="215" height="270" rx="16" stroke="#c9c3b6" stroke-width="2" />
  <rect x="1315" y="365" width="215" height="54" rx="16" fill="#eee7d9" />
  <path d="M1315 403 H1530" stroke="#c9c3b6" stroke-width="2" />
  <text class="boxTitle ink" x="1337" y="400">FLEX</text>
  <text class="metric" x="1337" y="463" fill="#a05c35">3</text>
  <text class="bodyBold ink" x="1384" y="461">rooms</text>
  <text class="body ink" x="1337" y="500">Unallocated</text>
  <text class="body ink" x="1337" y="530">No use assigned</text>
  <text class="body ink" x="1337" y="560">Do not count as</text>
  <text class="body ink" x="1337" y="590">owner or rental</text>
  <text class="body ink" x="1337" y="616">inventory yet</text>

  <path class="line" d="M410 500 H438" marker-end="url(#arrow)" />
  <path class="line" d="M775 500 H803" marker-end="url(#arrow)" />
  <path class="dash" d="M1280 500 H1307" />

  <rect x="70" y="665" width="460" height="220" rx="16" fill="#fffefa" stroke="#d2c8b6" stroke-width="2" />
  <text class="smallcaps green" x="96" y="704">SELECTED WORKING PRICE</text>
  <text class="metric ink" x="96" y="756">$4,800 / room-month</text>
  <text class="bodyBold ink" x="96" y="796">All-in resident bundle:</text>
  <text class="body ink" x="96" y="826">room + lab/program + amenities;</text>
  <text class="body ink" x="96" y="856">exact roster/scope TBD. Sharing does not</text>
  <text class="body ink" x="96" y="876">multiply the room price.</text>

  <rect x="570" y="665" width="460" height="220" rx="16" fill="#fffefa" stroke="#d2c8b6" stroke-width="2" />
  <text class="smallcaps green" x="596" y="704">FULL-OCCUPANCY GROSS POTENTIAL</text>
  <text class="metric ink" x="596" y="756">$3.2832M / year</text>
  <text class="body ink" x="596" y="796">57 × $4,800 × 12 · 100% occupancy only.</text>
  <text class="body ink" x="596" y="826">Before vacancy, service costs, OPEX, taxes,</text>
  <text class="body ink" x="596" y="856">reserves, or debt. Not a forecast, NOI,</text>
  <text class="body ink" x="596" y="876">cap rate, or investment return.</text>

  <rect x="1070" y="665" width="460" height="220" rx="16" fill="#fffefa" stroke="#d2c8b6" stroke-width="2" />
  <text class="smallcaps" x="1096" y="704" fill="#a05c35">LEAN COST + FUNDING STATUS</text>
  <text class="metric ink" x="1096" y="756">CAPEX / OPEX: TBD</text>
  <text class="body ink" x="1096" y="796">Capital ask and construction phase: TBD.</text>
  <text class="body ink" x="1096" y="826">$0 discretionary project budget.</text>
  <text class="body ink" x="1096" y="856">No investor, grant, sponsor, or customer</text>
  <text class="body ink" x="1096" y="876">commitment is secured.</text>

  <rect class="navy" x="70" y="915" width="1460" height="172" rx="16" />
  <text class="smallcaps" x="98" y="955" fill="#c9d8d3">LEAN WHOLE-BUILD PLAN · SITE TARGETS · PROOF GATES</text>
  <text x="98" y="997" fill="#fffefa" style="font:400 18px Arial, Helvetica, sans-serif">Repeat rooms · consolidate services · right-size commons · compare the bermed wing against measured site, safety, and cost</text>
  <text x="98" y="1033" fill="#fffefa" style="font:400 18px Arial, Helvetica, sans-serif">18% disturbance / 210 CY grading / five ponderosa retained are targets pending survey and measured design.</text>
  <text x="98" y="1067" fill="#d7e1dc" style="font:400 16px Arial, Helvetica, sans-serif">Before underwriting: verify demand, room/bundle scope, site access, use, utilities, wastewater, life safety, and costed test-fit.</text>

  <text class="foot muted" x="800" y="1140" text-anchor="middle">PARTNER DISCUSSION ONLY · NOT A SITE PLAN · NO DIMENSIONS · NO ENGINEERING / PERMIT / OCCUPANCY APPROVAL</text>
</svg>
