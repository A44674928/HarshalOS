name: Orb 2 CPU surgery
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Orb 2 read path and Options EOD date
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/orb2-field.mjs'); s=p.read_text()
          s=s.replace('async function readOrb2FieldRows(db, { interval, disc = null, symbols = [], limit = null }) {','async function readOrb2FieldRows(db, { interval, disc = null, symbols = [], limit = null, includePayload = true }) {',1)
          s=s.replace('let query = `SELECT payload, observed_at, symbol, disc_id, provider, confirmed FROM orb2_field_observations WHERE ${clauses.join(" AND ")} ORDER BY observed_at DESC`;','const select = includePayload ? "payload, observed_at, symbol, disc_id, provider, confirmed" : "observed_at, symbol, disc_id, provider, confirmed, status, reason";\n    let query = `SELECT ${select} FROM orb2_field_observations WHERE ${clauses.join(" AND ")} ORDER BY observed_at DESC`;',1)
          s=s.replace('fieldRows = await readOrb2FieldRows(db, { interval });','fieldRows = await readOrb2FieldRows(db, { interval, includePayload: false });',1)
          old='''        const parsed = parseFieldRow(row);\n        if (parsed) {\n          observationByDiscAndSymbol.set(`${discId}:${symbol}`, {\n            ...parsed,\n            provider: text(row.provider, 24) || parsed.provider,\n            freshness: orb2FieldFreshness(interval, parsed.observedAt, now)\n          });\n        }'''
          new='''        const parsed = row.payload ? parseFieldRow(row) : (() => {\n          const observedAt = Number(row.observed_at) || 0;\n          const hasMarket = row.status === "bars" || row.status === "cached";\n          return observedAt > 0 ? { symbol, discId, provider: text(row.provider, 24), status: hasMarket ? row.status : "unavailable", code: hasMarket ? "" : text(row.reason, 48), message: text(row.reason, 160), confirmed: Number(row.confirmed) > 0, observedAt, interval, market: hasMarket ? { latestBar: { confirmed: Number(row.confirmed) > 0 } } : null, freshness: orb2FieldFreshness(interval, observedAt, now) } : null;\n        })();\n        if (parsed) {\n          observationByDiscAndSymbol.set(`${discId}:${symbol}`, {\n            ...parsed,\n            provider: text(row.provider, 24) || parsed.provider,\n            freshness: orb2FieldFreshness(interval, parsed.observedAt, now)\n          });\n        }'''
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('date: today, now, fetcher, keys','date: eodDate, now, fetcher, keys',1)
          p.write_text(s)
          PY
      - name: Commit surgical patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/orb2-field.mjs
          git rm .github/workflows/surgical-orb2-cpu-eod.yml
          git commit -m "Fix Orb 2 focused read CPU path and Options EOD date"
          git push
